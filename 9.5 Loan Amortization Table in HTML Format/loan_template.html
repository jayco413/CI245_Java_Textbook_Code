<html>
    <head>
        <title>Loan Amortization Table</title>
        <style>
            th, td { text-align: right; padding: 2px 10px; }
        </style>
    </head>
    <body>
        <h1>Loan Information</h1>
        <table>
            <tr>
                <th>Principal:</th>
                <td>{{principal}}</td>
            </tr>
            <tr>
                <th>Interest:</th>
                <td>{{interest rate}}</td>
            </tr>
            <tr>
                <th>Term:</th>
                <td>{{term}}</td>
            </tr>
            <tr>
                <th>Payment:</th>
                <td>{{payment}}</td>
            </tr>
        </table>

        <h1>Amortization Table</h1>
        <table>
            <tr>
                <th>Month</th>
                <th>Beginning Bal.</th>
                <th>Payment</th>
                <th>Principal</th>
                <th>Interest</th>
                <th>Balance</th>
            </tr>
            <!-- loop here, once for each row of the table -->
            <tr>
                <th>{{row month}}</th>
                <td>{{row beginning balance}}</td>
                <td>{{row payment}}</td>
                <td>{{row principal}}</td>
                <td>{{row interest}}</td>
                <td>{{row balance}}</td>
            </tr>
            <!-- end row to loop -->
        </table>
    </body>
</html>
